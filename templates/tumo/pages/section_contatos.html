<section id="contact" class="contact">
    <div class="container" data-aos="fade-up">

      <div class="section-title">
        <h2>CONTATOS</h2>
      </div>

      <div class="row mt-1 justify-content-center">
        <div class="col-lg-8 mt-5 mt-lg-0">

          <form method="POST" id="form_contato" class="email-form" action="{% url 'tumo:contato_send_email' %}" novalidate>
            {% csrf_token %}
            <div class="row">
              <div class="col-md-6 form-group">
                {{ contato_form.nome }}
              </div>

              <div class="col-md-6 form-group mt-3 mt-md-0">
                {{ contato_form.email }}
              </div>
            </div>

            <div class="form-group mt-3">
                {{ contato_form.mensagem }}
              </div>

            <div class="my-3">
              <div class="error-message rounded"></div>
              <div class="sent-message rounded"></div>
            </div>
            
            <div class="text-center"><button type="submit" id="btn_enviar_form_contato">Enviar</button></div>
          </form>

        </div>
      </div>

    </div>
</section>
{% include 'tumo/pages/js_contatos.html' %}
