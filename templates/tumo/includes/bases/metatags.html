{% load static %}

<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

<link rel="icon" href="{% static 'tumo/img/favicon.png' %}">
<link rel="apple-touch-icon" href="{% static 'tumo/img/favicon.png' %}">
<link rel="image_src" href="{% static 'tumo/img/tumo-bg-home.jpg' %}">

<title>{{ metatags.title }}</title>
<meta name="description" content="{{ metatags.description|striptags }}">
<meta name="keywords" content="{{ metatags.keywords|striptags|cut:'    ' }}">
<meta name="author" content="Tumo Soluções">
<meta name="robots" content="index, follow, noarchive">

<meta property="og:title" content="{{ metatags.title }}">
<meta property="og:description" content="{{ metatags.description|striptags }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ request.build_absolute_uri }}">
<meta property="og:image" content="{{ metatags.image_src }}">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ metatags.title }}">
<meta name="twitter:description" content="{{ metatags.description|striptags }}">
<meta name="twitter:image" content="{{ metatags.image_src }}">
